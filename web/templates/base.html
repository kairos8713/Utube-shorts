<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Reels Kontrol{% endblock %}</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5d6677; --line: #dfe3ea;
  --accent: #2f5bd3; --danger: #c62828; --danger-bg: #fdecec; --warn: #a15c00; --warn-bg: #fff4e0;
  --ok: #1b7a3d; --ok-bg: #e6f4ea;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --panel: #1b2029; --text: #e6e9ef; --muted: #9aa3b2; --line: #2c3340;
    --accent: #7ea2ff; --danger: #ff6b6b; --danger-bg: #3a1d1f; --warn: #ffb74d; --warn-bg: #3a2c16;
    --ok: #6fd08c; --ok-bg: #173023;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
       font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 0 16px; }
nav { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; max-width: 1200px; margin: 0 auto; }
nav a { color: var(--muted); text-decoration: none; padding: 12px 10px; font-weight: 600; }
nav a.active, nav a:hover { color: var(--text); }
nav .brand { color: var(--text); margin-right: 12px; }
nav .spacer { flex: 1; }
main { max-width: 1200px; margin: 0 auto; padding: 16px; }
h1 { font-size: 22px; margin: 8px 0 16px; }
h2 { font-size: 17px; margin: 24px 0 8px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.stat .v { font-size: 22px; font-weight: 700; } .stat .k { color: var(--muted); font-size: 13px; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-size: 13px; font-weight: 600; }
.table-wrap { overflow-x: auto; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 700;
         background: var(--line); color: var(--text); }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.danger { background: var(--danger-bg); color: var(--danger); }
.alert { border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; border: 1px solid; }
.alert.danger { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }
.alert.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.alert.info { background: var(--panel); border-color: var(--line); }
button, .btn { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line);
               background: var(--panel); color: var(--text); cursor: pointer; text-decoration: none; display: inline-block; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.big { font-size: 18px; font-weight: 800; padding: 14px 24px; }
input, select, textarea { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
                          background: var(--bg); color: var(--text); }
form.inline { display: inline; }
.muted { color: var(--muted); }
pre { white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
{% if session.get('logged_in') %}
<header><nav>
  <a class="brand" href="{{ url_for('main.home') }}">Reels Kontrol</a>
  {% block nav %}{% endblock %}
  <span class="spacer"></span>
  <a href="{{ url_for('auth.logout') }}">Çıkış</a>
</nav></header>
{% endif %}
<main>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in msgs %}<div class="alert {{ 'danger' if cat == 'danger' else ('warn' if cat == 'warning' else 'info') }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
