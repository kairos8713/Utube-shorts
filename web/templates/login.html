{% extends "base.html" %}
{% block title %}Giriş{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:60px auto;">
  <h1>Giriş</h1>
  {% if not configured %}
    <div class="alert warn">Panel şifresi ayarlanmamış. Sunucuda çalıştırın:<br>
      <code>python scripts/init_secrets.py --set-panel-password</code></div>
  {% endif %}
  <form method="post">
    <p><input name="username" placeholder="Kullanıcı adı" autocomplete="username" required style="width:100%"></p>
    <p><input name="password" type="password" placeholder="Şifre" autocomplete="current-password" required style="width:100%"></p>
    <button class="btn primary" type="submit">Giriş yap</button>
  </form>
</div>
{% endblock %}
